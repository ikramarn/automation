version: "3.9"

# ── Production Docker Compose Overlay ────────────────────────────────────────
#
# Usage (on the VPS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay:
#   - Replaces build: with pre-built image: references from Docker Hub
#   - Removes dev volume mounts (no hot-reload in prod)
#   - Enables port 443 for TLS (handled by Caddy, not nginx)
#   - Removes nginx (Caddy handles reverse proxy + SSL in prod)
#   - Sets NODE_ENV=production
#   - Adds restart: always for all services

services:

  # ── Fastify Backend API ─────────────────────────────────────────────────────
  api:
    image: ${REGISTRY:-ikcloudky6/automation}:api-${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
    volumes: !reset []
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Next.js Dashboard ───────────────────────────────────────────────────────
  nextjs:
    image: ${REGISTRY:-ikcloudky6/automation}:dashboard-${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes: !reset []
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ── n8n ─────────────────────────────────────────────────────────────────────
  n8n:
    restart: always

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    restart: always

  # ── Nginx — disabled in prod (Caddy takes over) ───────────────────────────
  nginx:
    profiles:
      - dev-only   # Never starts in prod — Caddy handles routing + SSL

  # ── Caddy — Reverse Proxy + Automatic HTTPS (prod only) ────────────────────
  # Resolves api:3001 / nextjs:3000 as Docker service names — must be on the
  # same `public` network as those two services (defined in docker-compose.yml).
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
    depends_on:
      - api
      - nextjs
