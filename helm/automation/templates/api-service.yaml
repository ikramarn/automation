apiVersion: v1
kind: Service
metadata:
  name: automation-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: automation-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
