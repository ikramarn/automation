apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      app: automation-dashboard
  template:
    metadata:
      labels:
        app: automation-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: automation-dashboard
      containers:
        - name: dashboard
          image: {{ include "automation.image" (dict "global" .Values.global "image" .Values.dashboard.image) }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "{{ .Values.dashboard.port }}"
          # Public env vars are baked into the image at build time (Next.js).
          # Runtime env vars for server-side Next.js code come from the secret.
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          livenessProbe:
            httpGet:
              path: {{ .Values.dashboard.livenessProbe.path }}
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: {{ .Values.dashboard.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.dashboard.readinessProbe.path }}
              port: {{ .Values.dashboard.port }}
            initialDelaySeconds: {{ .Values.dashboard.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.dashboard.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
