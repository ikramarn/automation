apiVersion: v1
kind: Service
metadata:
  name: automation-n8n
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "automation.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
  annotations:
    # Reminder: n8n must never be exposed via Ingress
    automation/internal-only: "true"
spec:
  # ClusterIP only — no external exposure ever
  type: ClusterIP
  selector:
    app: automation-n8n
  ports:
    - name: http
      port: {{ .Values.n8n.port }}
      targetPort: http
      protocol: TCP
