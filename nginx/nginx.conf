# ── Nginx Reverse Proxy Configuration ────────────────────────────────────────
#
# Routing:
#   /api/  → Fastify Backend API (http://api:3001/)
#   /      → Next.js Dashboard   (http://nextjs:3000/)
#
# TLS:
#   Port 80  — HTTP, redirects to HTTPS in production (see TLS server block below)
#   Port 443 — HTTPS with Let's Encrypt certificate (production only)
#
# Networks:
#   The `api` and `nextjs` upstreams are resolved via Docker's internal DNS
#   using container names. They are on the `public` network shared with Nginx.
#   Nginx itself never contacts Redis or n8n (internal-only network).

worker_processes auto;           # Scale to available CPU cores automatically
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;     # Maximum concurrent connections per worker
    use epoll;                   # Linux-optimised I/O event model
    multi_accept on;             # Accept as many connections as possible per wake
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging format ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;       # Send headers and file start in one packet
    tcp_nodelay        on;       # Disable Nagle algorithm for low-latency responses
    keepalive_timeout  65;
    gzip               on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    gzip_min_length    1024;     # Don't compress tiny responses (wasted CPU)
    gzip_vary          on;

    # ── Security headers applied globally ────────────────────────────────────
    # X-Frame-Options and Content-Security-Policy are handled by Fastify Helmet
    # and Next.js security headers, but adding a fallback here is defense-in-depth.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Upstream declarations ─────────────────────────────────────────────────
    upstream api_upstream {
        server api:3001;
        # keepalive: maintain a pool of connections to the API container
        # to avoid TCP handshake overhead on every proxied request.
        keepalive 32;
    }

    upstream nextjs_upstream {
        server nextjs:3000;
        keepalive 32;
    }

    # ── HTTP server (development / HTTP→HTTPS redirect in production) ─────────
    server {
        listen 80;
        server_name _;             # Match any hostname (override with actual domain)

        # Stripe webhook: forward raw body so Fastify can verify the signature.
        # The Content-Length must be preserved intact (no body buffering changes).
        location /webhooks/stripe {
            proxy_pass         http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Do NOT buffer the request body — Stripe signature validation needs
            # the raw, unmodified byte stream.
            proxy_request_buffering off;
        }

        # API routes: strip the /api prefix before forwarding to Fastify.
        # Example: /api/health → http://api:3001/health
        location /api/ {
            proxy_pass         http://api_upstream/;   # Trailing slash strips /api prefix
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";   # Required for upstream keepalive
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts: pipeline trigger calls may take several seconds while
            # n8n processes the workflow enqueue — allow up to 60 s.
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Next.js hot-reload WebSocket (development only)
        location /_next/webpack-hmr {
            proxy_pass          http://nextjs_upstream;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
        }

        # All other requests → Next.js Dashboard
        location / {
            proxy_pass         http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # ── HTTPS server (production — uncomment when TLS certs are provisioned) ──
    #
    # To enable:
    # 1. Set DOMAIN in your .env.prod
    # 2. Provision a Let's Encrypt certificate with Certbot
    # 3. Uncomment this block and reload Nginx
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name YOUR_DOMAIN_HERE;        # e.g. app.example.com
    #
    #     # TLS certificate paths — provisioned by Certbot on the host and
    #     # bind-mounted into the container via docker-compose.prod.yml.
    #     ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    #
    #     # Certbot-managed options (cipher suites, OCSP stapling, etc.)
    #     include /etc/letsencrypt/options-ssl-nginx.conf;
    #     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    #
    #     # HSTS: tell browsers to always use HTTPS for 1 year.
    #     # Only enable after confirming HTTPS is fully working.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # ── Same location blocks as the HTTP server above ──────────────────
    #
    #     location /webhooks/stripe {
    #         proxy_pass         http://api_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #         proxy_request_buffering off;
    #     }
    #
