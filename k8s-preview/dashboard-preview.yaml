apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-preview
  namespace: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-preview
  template:
    metadata:
      labels:
        app: dashboard-preview
    spec:
      containers:
        - name: dashboard
          image: ikcloudky6/automation:dashboard-preview
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-preview-svc
  namespace: automation
spec:
  selector:
    app: dashboard-preview
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
